services:
  db:
    # Keep the major version in step with the Railway Postgres instance (Railway's default is 16).
    image: postgres:16
    environment:
      POSTGRES_USER: agoranote
      POSTGRES_PASSWORD: agoranote
      POSTGRES_DB: agoranote
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agoranote -d agoranote"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file: .env
    environment:
      # File-change events don't cross Docker bind mounts on Windows/macOS, so poll instead.
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ./backend:/app
      - uploads:/data/uploads
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Two Celery workers from the same image: "processing" handles study sets one at a time, "quick"
  # handles replacement quiz questions, so those never wait behind a long transcription.
  worker: &worker
    build: ./backend
    command: celery -A app.worker worker --loglevel=info -Q processing --concurrency=1 -n processing@%h
    env_file: .env
    # Lets the worker reach Ollama running on the host machine. Docker Desktop (Windows/macOS) knows
    # this name already; the line is needed on Linux.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend:/app
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker-quick:
    <<: *worker
    command: celery -A app.worker worker --loglevel=info -Q quick --concurrency=1 -n quick@%h

  # Local Whisper (faster-whisper behind an OpenAI-compatible API). Optional: needs an NVIDIA GPU, and
  # only starts with `docker compose --profile gpu up`. A plain `docker compose up` works without it.
  speaches:
    profiles: [gpu]
    # Pinned to the build that was tested (its unload endpoint deadlocks, hence WHISPER__TTL below).
    image: ghcr.io/speaches-ai/speaches:latest-cuda@sha256:6ec12ebf890a17e0d4b242a8ba9e0eb1fb836e60e8a3c857aea9838d541579ac
    environment:
      # Unload Whisper from the GPU right after each request, so the LLM always has room.
      WHISPER__TTL: "0"
    volumes:
      - hf-hub-cache:/home/ubuntu/.cache/huggingface/hub  # downloaded models survive restarts
    ports:
      - "8001:8000"  # only for trying it from the host; the worker uses http://speaches:8000
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  frontend:
    image: node:24
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host"
    env_file: .env
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"

volumes:
  pgdata:
  uploads:
  frontend_node_modules:
  hf-hub-cache:
    name: hf-hub-cache  # a fixed name, so a volume created earlier with `docker run` is reused
