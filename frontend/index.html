<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AgoraNote</title>
    <!-- Shown under the title in search results. -->
    <meta
      name="description"
      content="AgoraNote turns your lecture notes and recordings into chapters with summaries, key concepts, flashcards and quizzes."
    />
    <!-- The browser tab's icon. Vite serves files in public/ from the site root. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- The title and text of the preview card when a link is shared in a chat app or social network. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AgoraNote" />
    <meta property="og:title" content="AgoraNote" />
    <meta
      property="og:description"
      content="Turn your lecture notes and recordings into chapters with summaries, key concepts, flashcards and quizzes."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
